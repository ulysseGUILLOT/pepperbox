# smart pepper — pilotage de la culture de piments.
# Le service ecoute sur 127.0.0.1:8080 (conteneur piments_web).
<VirtualHost *:80>
    ServerName pepperbox.ulysseguillot.fr

    # Le challenge ACME doit rester joignable depuis l'exterieur, sinon le
    # renouvellement du certificat echoue silencieusement dans 60 jours.
    <Location "/.well-known/acme-challenge/">
        Require all granted
    </Location>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://pepperbox.ulysseguillot.fr%{REQUEST_URI} [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/pepperbox_error.log
    CustomLog ${APACHE_LOG_DIR}/pepperbox_access.log combined
</VirtualHost>
