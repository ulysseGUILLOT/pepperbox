<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName pepperbox.ulysseguillot.fr

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/pepperbox.ulysseguillot.fr/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/pepperbox.ulysseguillot.fr/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    # Le retour de boucle NAT de la Freebox presente toutes les requetes du
    # LAN comme venant de 192.168.1.254 ; l'exterieur arrive avec son IP
    # publique reelle et recoit donc un 403. Verifie le 2026-09-27.
    <Location "/">
        Require ip 192.168.1.0/24
    </Location>

    # Seule route ouverte sur Internet : le raccourci iOS declare la
    # presence depuis la 4G. Ce bloc est plus specifique que <Location "/">
    # et l'emporte donc sur la restriction LAN, uniquement pour ce chemin.
    # Elle ne peut que deplacer un booleen : ni commander la lampe, ni lire
    # la telemetrie, ni modifier le programme.
    <Location "/api/presence/event">
        Require all granted
    </Location>

    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/

    ErrorLog ${APACHE_LOG_DIR}/pepperbox_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/pepperbox_ssl_access.log combined
</VirtualHost>
</IfModule>
