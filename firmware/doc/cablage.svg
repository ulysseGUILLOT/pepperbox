<svg xmlns="http://www.w3.org/2000/svg" width="960" height="930" viewBox="0 0 960 930" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Câblage du capteur SHT sur l'ESP32-S3 DevKitC-1</title>
<style>.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.halo{paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round}</style>
<rect width="960" height="930" rx="16" fill="#ffffff"/>
<text x="40" y="52" font-size="22" font-weight="700" fill="#24292f">Câblage du capteur SHT sur l'ESP32-S3</text>
