<line x1="40" y1="800" x2="920" y2="800" stroke="#d0d7de"/>
<text x="40" y="832" font-size="13" fill="#24292f"><tspan font-weight="700">3,3 V uniquement.</tspan> Les broches de l'ESP32-S3 ne tolèrent pas
<tspan x="40" dy="19">le 5 V : sur une carte capteur sans régulateur, il remonterait</tspan>
<tspan x="40" dy="19">sur SDA et SCL par les résistances de rappel.</tspan>
</text>
<text x="500" y="832" font-size="13" fill="#24292f"><tspan font-weight="700">Résistances de rappel.</tspan> Présentes sur presque toutes les cartes
<tspan x="500" dy="19">capteur. Capteur nu : 4,7 kΩ de SDA vers 3V3, et de SCL vers 3V3.</tspan>
</text>
<text x="40" y="906" font-size="12" fill="#57606a">Brochage du DevKitC-1 v1.1 d'Espressif. L'ordre des broches du capteur varie selon les cartes : suivre les noms sérigraphiés (VIN ou VCC), pas la position.</text>
