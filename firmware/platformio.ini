; Capteur de climat de la box : ESP32-S3 et SHT. Versions epinglees, pour
; qu'une compilation dans six mois produise le meme binaire.
[env:esp32s3]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    sensirion/arduino-sht@2.0.0

; Module N16R8 (lu par esptool flash-id) : 16 Mo de flash, la carte de
; reference n'en declare que 8. Ses 8 Mo de PSRAM octale restent eteints,
; rien ici n'en a besoin ; les activer demande
; board_build.arduino.memory_type = qio_opi et -DBOARD_HAS_PSRAM, sans quoi
; la carte redemarre en boucle.
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
