; Capteur de climat de la box : ESP32-S3 et SHT. Versions epinglees, pour
; qu'une compilation dans six mois produise le meme binaire.
[env:esp32s3]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    sensirion/arduino-sht@2.0.0
; Inscrit la version git dans include/version.h.
extra_scripts = pre:version.py

; Module N16R8 (lu par esptool flash-id) : 16 Mo de flash, la carte de
; reference n'en declare que 8. Ses 8 Mo de PSRAM octale restent eteints,
; rien ici n'en a besoin ; les activer demande
; board_build.arduino.memory_type = qio_opi et -DBOARD_HAS_PSRAM, sans quoi
; la carte redemarre en boucle.
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
; Deux emplacements d'application (app0, app1) : la mise a jour a distance
; ecrit dans celui qui ne tourne pas, puis bascule.
board_build.partitions = default_16MB.csv

; Mise a jour par le Wi-Fi : pio run -e esp32s3-ota -t upload. La carte
; rappelle le poste qui envoie : depuis WSL2 en reseau NAT elle ne le
; joint pas, passer alors par ota.ps1 cote Windows.
[env:esp32s3-ota]
extends = env:esp32s3
upload_protocol = espota
upload_port = pepperbox-box.local
upload_flags = --auth=${sysenv.PEPPERBOX_OTA_PASSWORD}
